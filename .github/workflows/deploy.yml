name: Deploy blog to GitHub Pages

# 推送到 main 分支，或在 Actions 页面手动触发时部署
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署；新的推送会取消排队中的旧任务
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static site
        run: |
          # 绑定自定义域名（src/public/CNAME）时站点在根路径；
          # 用户主页仓库（owner.github.io）也在根路径；
          # 其余普通项目仓库部署在 /<repo>/ 子路径下。
          if [ -f src/public/CNAME ]; then
            export BASE_PATH="/"
          elif [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            export BASE_PATH="/"
          else
            export BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
